# The gateway authenticates to ate-api-server as the shared ate-client
# ServiceAccount (it mints that account's tokens) and to atenet-router with a
# podidentity certificate for atenet-client (PodCertificateRequests). It reads
# ClusterTrustBundles to verify both servers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-local-gateway
  namespace: ate-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ate-local-gateway-in-cluster
  namespace: ate-system
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  resourceNames: ["ate-client"]
  verbs: ["create"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["podcertificaterequests"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ate-local-gateway-in-cluster
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ate-local-gateway-in-cluster
subjects:
- kind: ServiceAccount
  name: ate-local-gateway
  namespace: ate-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-local-gateway-in-cluster
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["clustertrustbundles"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-local-gateway-in-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ate-local-gateway-in-cluster
subjects:
- kind: ServiceAccount
  name: ate-local-gateway
  namespace: ate-gateway
