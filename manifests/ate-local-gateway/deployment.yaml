# One replica: idle suspend is tracked in the gateway's memory, so a second
# replica could suspend an actor whose tunnels go through the first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-local-gateway
  namespace: ate-gateway
  labels:
    app: ate-local-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ate-local-gateway
  template:
    metadata:
      labels:
        app: ate-local-gateway
    spec:
      serviceAccountName: ate-local-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: ate-local-gateway
        command: ["/usr/local/bin/ate-local-gateway"]
        args:
        - --in-cluster
        - --control=0.0.0.0:18700
        - --proxy=0.0.0.0:18701
        - --egress-policy=/etc/ate-local-gateway/egress-policy.json
        - --max-idle=15m
        ports:
        - name: control
          containerPort: 18700
        - name: proxy
          containerPort: 18701
        readinessProbe:
          httpGet:
            path: /healthz
            port: control
        livenessProbe:
          httpGet:
            path: /healthz
            port: control
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: egress-policy
          mountPath: /etc/ate-local-gateway
          readOnly: true
      volumes:
      - name: egress-policy
        configMap:
          name: ate-local-gateway-egress-policy
