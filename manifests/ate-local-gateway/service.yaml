apiVersion: v1
kind: Service
metadata:
  name: ate-local-gateway
  namespace: ate-gateway
spec:
  type: NodePort
  selector:
    app: ate-local-gateway
  ports:
  - name: control
    port: 18700
    targetPort: control
    nodePort: 30700
  - name: proxy
    port: 18701
    targetPort: proxy
    nodePort: 30701
