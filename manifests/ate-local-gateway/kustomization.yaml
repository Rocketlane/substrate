# ate-local-gateway running inside the cluster (--in-cluster), reachable from
# outside on NodePorts: 30700 (control API) and 30701 (data-plane proxy).
# Put a load balancer in front of the nodes' NodePorts and keep it private: the
# gateway does not authenticate its callers.
#
#   kubectl apply -k manifests/ate-local-gateway
#
# Replace egress-policy.json with the policy every actor created through the
# gateway should get.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- rbac.yaml
- deployment.yaml
- service.yaml
configMapGenerator:
- name: ate-local-gateway-egress-policy
  namespace: ate-gateway
  files:
  - egress-policy.json
