apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Amazon EKS install (ate-setup --eks). Differs from ../base in:
#   - ./atelet, ./ate-api-server: snapshots in S3 with EKS Pod Identity credentials
#     (no static keys; region from the ate-eks-config ConfigMap ate-setup writes),
#     and atelet's image credential provider at the EKS AL2023 node paths.
#   - ate-otel-config.yaml: no managed collector on EKS, so export is disabled
#     until --otlp-endpoint names one.
#   - atenet-router-monitoring.yaml is left out: it needs the GKE managed
#     Prometheus CRDs.
# ./prereqs (StorageClass, gateway RBAC) is applied by ate-setup before
# PostgreSQL, so it is not part of this bundle. pod-certificate-controller.yaml
# is applied by ate-setup on its own, as for kind.
resources:
  - ./ate-api-server
  - ../ate-idp-server.yaml
  - ../ate-controller.yaml
  - ./atelet
  - ../atenet-router.yaml
  - ../ate-system-networkpolicies.yaml
  - ate-otel-config.yaml
