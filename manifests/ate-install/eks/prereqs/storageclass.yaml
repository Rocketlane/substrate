# Encrypted gp3 volumes from the EBS CSI driver (EKS add-on aws-ebs-csi-driver)
# for the bundled PostgreSQL. EKS marks no StorageClass default since 1.30, and
# the add-on's own default class is not encrypted.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ate-gp3-encrypted
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
