# Kubernetes permissions for cmd/ate-local-gateway running outside the cluster
# (e.g. as a sidecar of an ECS service). Map the gateway's IAM role to the
# group ate-local-gateway with an EKS access entry (kubernetes_groups), no EKS
# access policy. The gateway:
#   - port-forwards to ate-api-server and atenet-router (services get, pods
#     list, pods/portforward create);
#   - mints the ate-client ServiceAccount token for ate-api-server's API. That
#     ServiceAccount is a bootstrap owner of the install by default, so the
#     gateway can do anything through ate-api-server;
#   - requests its atenet-router client certificate as atenet-client through a
#     PodCertificateRequest;
#   - reads ClusterTrustBundles to verify ate-api-server and atenet-router.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ate-local-gateway
  namespace: ate-system
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/portforward"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  resourceNames: ["ate-client"]
  verbs: ["create"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["podcertificaterequests"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ate-local-gateway
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ate-local-gateway
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: ate-local-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-local-gateway
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["clustertrustbundles"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-local-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ate-local-gateway
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: ate-local-gateway
