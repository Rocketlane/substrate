apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../atelet.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: atelet
        namespace: ate-system
      spec:
        template:
          spec:
            # EKS AL2023 nodes keep the kubelet's ECR credential provider here
            # (nodeadm's --image-credential-provider-bin-dir / -config). atelet
            # runs it in its own pod, so it authenticates with atelet's EKS Pod
            # Identity role, which needs ECR read access.
            volumes:
            - name: image-credential-provider-bin
              hostPath:
                path: /etc/eks/image-credential-provider
                type: Directory
            - name: image-credential-provider-config
              hostPath:
                path: /etc/eks/image-credential-provider/config.json
                type: File
            initContainers:
            - name: objectstore-plugin
              # S3 with EKS Pod Identity: the pod identity agent injects
              # AWS_CONTAINER_CREDENTIALS_FULL_URI; the region comes from
              # ate-eks-config because pods cannot read it from instance metadata.
              env:
              - name: ATE_STORAGE_BACKEND
                value: s3
              envFrom:
              - configMapRef:
                  name: ate-eks-config
