apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../ate-api-server.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ate-api-server
        namespace: ate-system
      spec:
        template:
          spec:
            initContainers:
            - name: objectstore-plugin
              # S3 with EKS Pod Identity: the pod identity agent injects
              # AWS_CONTAINER_CREDENTIALS_FULL_URI; the region comes from
              # ate-eks-config because pods cannot read it from instance metadata.
              env:
              - name: ATE_STORAGE_BACKEND
                value: s3
              envFrom:
              - configMapRef:
                  name: ate-eks-config
