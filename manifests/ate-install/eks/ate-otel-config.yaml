# EKS has no managed OpenTelemetry collector to default to. Export is disabled;
# ate-setup --otlp-endpoint overrides the endpoint (and an operator can drop
# OTEL_SDK_DISABLED) once a collector exists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-otel-config
  namespace: ate-system
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
  OTEL_SDK_DISABLED: "true"
